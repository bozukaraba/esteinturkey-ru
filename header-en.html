.eit-dropdown::after {

<script>
(function(){
  var MENU_API = 'https://esteinturkey.com/en/este-menu.php';
  var CHEVRON  = '<svg class="eit-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  var CHEVRON_M= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

  function renderDesktop(items) {
    var nav = document.getElementById('eitDesktopNav');
    if (!nav) return;
    var html = '';
    items.forEach(function(item) {
      var hasSub = item.children && item.children.length > 0;
      var hasUrl = item.url && item.url !== '#' && item.url !== '';
      if (hasSub) {
        html += '<li class="eit-nav-item eit-has-drop">';
        html += '<a href="' + (hasUrl ? item.url : 'javascript:void(0)') + '" class="eit-nav-link">' + item.title + CHEVRON + '</a>';
        html += '<div class="eit-dropdown">';
        item.children.forEach(function(child) {
          html += '<a href="' + child.url + '"' + (child.target === '_blank' ? ' target="_blank" rel="noopener"' : '') + '>' + child.title + '</a>';
        });
        html += '</div></li>';
      } else {
        html += '<li class="eit-nav-item">';
        html += '<a href="' + item.url + '" class="eit-nav-link"' + (item.target === '_blank' ? ' target="_blank" rel="noopener"' : '') + '>' + item.title + '</a>';
        html += '</li>';
      }
    });
    nav.innerHTML = html;
  }

  function renderMobile(items) {
    var nav = document.getElementById('eitMobileNav');
    if (!nav) return;
    var html = '';
    items.forEach(function(item) {
      var hasSub = item.children && item.children.length > 0;
      if (hasSub) {
        var hasUrl = item.url && item.url !== '#' && item.url !== '';
        html += '<li class="eit-mm-item eit-has-sub">';
        if (hasUrl) {
          html += '<div class="eit-mm-link-row">';
          html += '<a href="' + item.url + '" class="eit-mm-link-a">' + item.title + '</a>';
          html += '<button class="eit-mm-chevron" aria-expanded="false">' + CHEVRON_M + '</button>';
          html += '</div>';
        } else {
          html += '<button class="eit-mm-link" aria-expanded="false">' + item.title + CHEVRON_M + '</button>';
        }
        html += '<div class="eit-mm-sub">';
        item.children.forEach(function(child) {
          html += '<a href="' + child.url + '"' + (child.target === '_blank' ? ' target="_blank" rel="noopener"' : '') + '>' + child.title + '</a>';
        });
        html += '</div></li>';
      } else {
        html += '<li class="eit-mm-item">';
        html += '<a href="' + item.url + '" class="eit-mm-link"' + (item.target === '_blank' ? ' target="_blank" rel="noopener"' : '') + '>' + item.title + '</a>';
        html += '</li>';
      }
    });
    nav.innerHTML = html;
  }

  function loadMenu() {
    var cacheKey = 'eit_menu_cache_en';
    var cacheTs  = 'eit_menu_ts_en';
    var now      = Date.now();
    var cached   = sessionStorage.getItem(cacheKey);
    var ts       = parseInt(sessionStorage.getItem(cacheTs) || '0');
    if (cached && (now - ts) < 300000) {
      var data = JSON.parse(cached);
      renderDesktop(data); renderMobile(data); return;
    }
    fetch(MENU_API)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var items = d.items || [];
        sessionStorage.setItem(cacheKey, JSON.stringify(items));
        sessionStorage.setItem(cacheTs, String(now));
        renderDesktop(items);
        renderMobile(items);
      })
      .catch(function(e) { console.warn('EIT Menu fetch failed', e); });
  }

  loadMenu();

  var header   = document.getElementById('eitHeader');
  var hamburger= document.getElementById('eitHamburger');
  var menu     = document.getElementById('eitMobileMenu');
  var overlay  = document.getElementById('eitOverlay');
  var mmClose  = document.getElementById('eitMmClose');

  var spacer = document.getElementById('eitHeaderSpacer');
  function syncSpacer() { spacer.style.height = header.offsetHeight + 'px'; }
  syncSpacer();
  window.addEventListener('resize', syncSpacer, {passive: true});

  var THRESHOLD = 60;
  window.addEventListener('scroll', function(){
    header.classList.toggle('eit-scrolled', window.scrollY > THRESHOLD);
  }, {passive: true});

  function openMenu(){
    menu.classList.add('is-open');
    overlay.classList.add('is-open');
    hamburger.classList.add('is-open');
    hamburger.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu(){
    menu.classList.remove('is-open');
    overlay.classList.remove('is-open');
    hamburger.classList.remove('is-open');
    hamburger.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
  }
  hamburger.addEventListener('click', function(){ menu.classList.contains('is-open') ? closeMenu() : openMenu(); });
  mmClose.addEventListener('click', closeMenu);
  overlay.addEventListener('click', closeMenu);

  function toggleMmItem(item) {
    var wasOpen = item.classList.contains('is-open');
    document.querySelectorAll('.eit-mm-item.is-open').forEach(function(el) { el.classList.remove('is-open'); });
    if (!wasOpen) item.classList.add('is-open');
  }
  function bindMobileAccordion() {
    var nav = document.getElementById('eitMobileNav');
    if (!nav) return;
    nav.addEventListener('click', function(e) {
      var btn = e.target.closest('.eit-mm-chevron, .eit-mm-item.eit-has-sub > .eit-mm-link');
      if (btn) {
        e.preventDefault();
        toggleMmItem(btn.closest('.eit-mm-item'));
        return;
      }
    });
  }
  bindMobileAccordion();

  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeMenu(); });
})();
</script>
